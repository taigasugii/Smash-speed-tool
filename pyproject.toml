[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smash-speed"
version = "0.0.1"
description = "バドミントンのスマッシュ動画からシャトルの初速・平均速度を推定する研究用ツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "opencv-python>=4.9",
    "flask>=3.0",
]

[project.optional-dependencies]
# Phase 6 で導入（CPU 版で可）
dl = ["torch>=2.2", "torchvision>=0.17"]
# ONNX のモデルの推論（Windows は DirectML で GPU を使う。smash_speed/accel.py・docs/gpu.md）
gpu = [
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "onnx>=1.15",
]
# 姿勢推定（任意。ROADMAP E 章）。RTMPose（rtmlib）は onnxruntime を一緒に入れようとし、Windows で
# onnxruntime-directml と両方入ると壊れるので、ここには入れず pip install --no-deps rtmlib tqdm で入れる
pose = ["mediapipe>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
smash-speed = "smash_speed.cli:main"

[project.gui-scripts]
smash-speed-gui = "smash_speed.webapp.server:main"

[tool.setuptools.packages.find]
include = ["smash_speed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
