<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smash-speed</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1><span class="logo">⚡</span>smash-speed</h1>
      <p>スマッシュの初速を動画から測る</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="foot-video" class="small">動画：未選択</div>
      <button class="btn ghost sm" id="btn-quit" style="margin-top:6px;padding-left:0">アプリを終了</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="title" id="page-title"></div>
      <div class="crumb" id="page-crumb"></div>
      <div class="spacer"></div>
      <div id="top-actions" class="row"></div>
    </header>
    <section class="content" id="content"></section>
    <div class="taskbar hidden" id="taskbar">
      <div class="head">
        <span class="t" id="task-title"></span>
        <div class="prog"><i></i></div>
        <span class="muted small" id="task-status"></span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn sm ghost" id="task-log-toggle">ログを表示</button>
        <button class="btn sm danger" id="task-cancel">中止</button>
        <button class="btn sm ghost" id="task-close">閉じる</button>
      </div>
      <pre id="task-log" class="hidden"></pre>
    </div>
  </main>
</div>
<script src="/static/core.js"></script>
<script src="/static/frameview.js"></script>
<script src="/static/court.js"></script>
<script src="/static/views.js"></script>
<script src="/static/calib.js"></script>
<script src="/static/annotate.js"></script>
<script src="/static/fastest.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
